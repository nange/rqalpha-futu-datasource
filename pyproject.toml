[project]
name = "rqalpha-futu-datasource"
version = "2.0.0"
description = "Futu datasource for rqalpha"
readme = "README.md"
requires-python = ">=3.11, <4.0"
authors = [{ name = "nange", email = "cctonange@gmail.com" }]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "futu-api>=10.0.6008",
    "rqalpha @ git+https://github.com/nange/rqalpha.git@6.1.3.3",
    "ruff>=0.15.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rqalpha_futu_datasource"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = ["ruff>=0.15.6", "pytest>=9.0.0"]
